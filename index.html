<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS Opções de Brunch</title>
<style>
  :root{
    --olive:#444E43;
    --olive-deep:#333A30;
    --cream:#F7F3EA;
    --cream-ink:#F4F1E5;
    --ink:#272720;
    --ink-soft:#56584F;
    --rust:#AE5B29;
    --rust-deep:#8F4A21;
    --line-on-cream: rgba(39,39,32,0.14);
    --line-on-olive: rgba(244,241,229,0.22);
    color-scheme: light;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%;display:block;}
  h1,h2,h3,.serif{
    font-family:'Cormorant Garamond','Times New Roman',serif;
    font-weight:600;
    line-height:1.15;
    margin:0;
  }
  .wrap{max-width:900px;margin:0 auto;padding:0 28px;}
  a{color:inherit;}

  header{background:var(--olive);color:var(--cream-ink);padding:22px 28px;}
  .header-row{max-width:900px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand img{width:46px;height:46px;border-radius:50%;border:1px solid var(--line-on-olive);}
  .brand-name{font-family:'Cormorant Garamond',serif;font-size:1.05rem;letter-spacing:0.02em;}
  .lang-toggle{display:flex;border:1px solid var(--line-on-olive);border-radius:999px;overflow:hidden;}
  .lang-toggle button{
    appearance:none;border:none;background:transparent;color:var(--cream-ink);
    font-family:'Inter',sans-serif;font-size:0.9rem;font-weight:500;
    padding:10px 18px;min-height:44px;cursor:pointer;opacity:0.65;
  }
  .lang-toggle button[aria-pressed="true"]{background:var(--cream-ink);color:var(--olive-deep);opacity:1;}

  .hero{background:var(--olive);color:var(--cream-ink);text-align:center;padding:64px 28px 56px;}
  .hero-kicker{font-size:0.95rem;color:#D8CBB5;margin-bottom:12px;}
  .hero h1{font-size:2.8rem;line-height:1.08;letter-spacing:0.01em;}
  .hero-sub{max-width:560px;margin:18px auto 0;font-size:1.05rem;line-height:1.55;color:#E5E0D2;}

  section{padding:56px 0;}
  .section-title{font-size:2rem;margin-bottom:8px;}
  .section-intro{color:var(--ink-soft);font-size:1rem;margin-bottom:28px;max-width:560px;}

  /* ---- summary cards ---- */
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
  .card{
    border:1px solid var(--line-on-cream);
    padding:22px;
    display:flex;flex-direction:column;
    transition:border-color 0.15s ease;
  }
  .card.active{border-color:var(--rust-deep);border-width:2px;padding:21px;}
  .card h3{font-size:1.2rem;}
  .card .tagline{margin-top:4px;font-size:0.9rem;font-style:italic;color:var(--rust-deep);}
  .card .price{margin-top:12px;font-family:'Cormorant Garamond',serif;font-size:1.3rem;}
  .card .price .vat{font-family:'Inter',sans-serif;font-size:0.85rem;color:var(--ink-soft);}
  .card ul{margin:12px 0 0;padding:0;list-style:none;font-size:0.9rem;color:var(--ink-soft);flex:1;}
  .card li{padding:3px 0;}
  .card button{
    margin-top:16px;border:none;cursor:pointer;
    background:var(--rust);color:var(--cream-ink);
    padding:11px 18px;border-radius:999px;font-size:0.9rem;font-weight:600;
  }
  .card button:hover{background:var(--rust-deep);}
  @media (max-width:760px){ .cards{grid-template-columns:1fr;} }

  /* ---- tabs ---- */
  .tabs{display:flex;flex-wrap:wrap;gap:8px;border-bottom:1px solid var(--line-on-cream);padding-bottom:18px;margin-bottom:34px;}
  .tabs button{
    appearance:none;border:1px solid var(--line-on-cream);background:transparent;
    color:var(--ink-soft);padding:10px 20px;border-radius:999px;font-size:0.9rem;font-weight:500;
    cursor:pointer;min-height:44px;
  }
  .tabs button[aria-selected="true"]{background:var(--olive);color:var(--cream-ink);border-color:var(--olive);}

  .menu-group + .menu-group{margin-top:36px;}
  .menu-group h3{font-style:italic;font-weight:500;font-size:1.3rem;color:var(--rust-deep);margin-bottom:4px;}
  .menu-list{list-style:none;margin:12px 0 0;padding:0;}
  .menu-list li{
    padding:14px 0;border-top:1px solid var(--line-on-cream);
    font-size:1.02rem;line-height:1.45;
    display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px;
  }
  .menu-list li:last-child{border-bottom:1px solid var(--line-on-cream);}
  .diet-icon{display:inline-flex;width:17px;height:17px;color:var(--rust-deep);opacity:0.85;}
  .diet-icon svg{width:100%;height:100%;}
  .allergen-tags{display:inline-flex;align-items:center;gap:7px;}
  .veg-tag{
    display:inline-flex;align-items:center;gap:5px;font-family:'Inter',sans-serif;
    font-size:0.8rem;font-weight:600;letter-spacing:0.02em;color:#4C6B4A;background:#E7ECE2;
    border-radius:999px;padding:4px 11px 4px 8px;
  }
  .veg-tag .diet-icon{width:14px;height:14px;color:#4C6B4A;}
  .menu-legend{display:flex;flex-wrap:wrap;align-items:center;column-gap:18px;row-gap:10px;margin:0 0 30px;}
  .menu-legend-label{font-size:0.88rem;color:var(--ink-soft);}
  .menu-legend-item{display:inline-flex;align-items:center;gap:6px;font-size:0.88rem;color:var(--ink-soft);}
  .menu-legend-item .diet-icon{color:var(--rust-deep);}
  .drinks-text{margin-top:14px;font-size:1.02rem;line-height:1.6;color:var(--ink);}

  .included{background:var(--olive);color:var(--cream-ink);}
  .included .section-title, .included .section-intro{color:var(--cream-ink);}
  .included-grid{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  .included-grid h3{font-size:1.1rem;font-weight:600;font-family:'Inter',sans-serif;margin-bottom:14px;color:#E9E4D4;}
  .included-grid ul{list-style:none;margin:0;padding:0;font-size:1rem;line-height:1.5;color:#DDD8C9;}
  .included-grid li{padding:10px 0;border-top:1px solid var(--line-on-olive);}
  @media (max-width:560px){ .included-grid{grid-template-columns:1fr;gap:30px;} }

  .conditions-box{border:1px solid var(--line-on-cream);padding:24px 28px;}
  .conditions-box ul{margin:0;padding:0;list-style:none;font-size:1rem;line-height:1.6;color:#44463D;}
  .conditions-box li{padding:10px 0;border-top:1px solid var(--line-on-cream);}
  .conditions-box li:first-child{border-top:none;padding-top:0;}

  .cta{background:var(--olive-deep);color:var(--cream-ink);text-align:center;}
  .cta h2{font-size:2rem;}
  .cta p{margin:14px auto 0;max-width:420px;color:#D8D3C3;font-size:1rem;line-height:1.55;}
  .cta-button{
    display:inline-block;margin-top:26px;background:var(--rust);color:var(--cream-ink);
    text-decoration:none;padding:15px 34px;border-radius:999px;font-size:1rem;font-weight:600;
  }
  .cta-button:hover{background:var(--rust-deep);}
  .cta-contact{margin-top:20px;font-size:1rem;line-height:1.6;color:#C3BCA6;}
  .cta-contact a{text-decoration:underline;text-underline-offset:3px;}

  footer{
    background:var(--olive-deep);color:#BFB9A4;text-align:center;
    padding:34px 28px 40px;font-size:0.9rem;line-height:1.6;border-top:1px solid var(--line-on-olive);
  }
  footer .foot-brand{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--cream-ink);margin-bottom:8px;}
  footer p{margin:5px 0;}

  @media (max-width:560px){
    .hero{padding:52px 22px 48px;}
    .hero h1{font-size:2.2rem;}
    .wrap{padding:0 22px;}
    section{padding:44px 0;}
    .section-title{font-size:1.6rem;}
    .cta h2{font-size:1.6rem;}
    .conditions-box{padding:22px;}
  }
</style>
</head>

  renderAll();
})();
</script>
